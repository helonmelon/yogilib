{{define "content"}}
<div class="login-wrap">
  <p class="login-om">ॐ</p>
  <h1>Yogilib</h1>
  <p class="login-subtitle">{{t "व्यवस्थापक पहुँच"}}</p>

  {{if .Error}}<div class="flash flash-err">{{t .Error}}</div>{{end}}

  <form class="login-form" method="POST" action="/login">
    <div class="form-group">
      <label for="email">{{t "इमेल"}}</label>
      <input type="email" id="email" name="email" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">{{t "पासवर्ड"}}</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary login-btn">{{t "प्रवेश गर्नुहोस्"}}</button>
  </form>
</div>
{{end}}
