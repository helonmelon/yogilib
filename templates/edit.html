{{define "content"}}
<div class="container">
  <h2>{{t "कागजात सम्पादन"}}</h2>
  <a class="back-link" href="/document/{{.Doc.ID}}">{{t "← कागजातमा फर्कनुहोस्"}}</a>

  {{if .Flash}}<div class="flash flash-ok">{{t .Flash}}</div>{{end}}
  {{if .Error}}<div class="flash flash-err">{{t .Error}}</div>{{end}}

  <form class="form-card" method="POST" action="/document/{{.Doc.ID}}/edit">

    <!-- Titles -->
    <div class="form-group">
      <label for="title">{{t "शीर्षक (English)"}}</label>
      <input type="text" id="title" name="title" value="{{.Doc.Title}}" required>
    </div>

    <div class="form-group">
      <label for="title_np">{{t "शीर्षक (नेपाली)"}}</label>
      <input type="text" id="title_np" name="title_np" value="{{.Doc.TitleNP}}">
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="category">{{t "वर्ग / Category"}}</label>
      <select id="category" name="category">
        <option value="">{{t "— छान्नुहोस् —"}}</option>
        <option value="किताब"   {{if eq .Doc.Category "किताब"}}selected{{end}}>{{t "किताब (Book)"}}</option>
        <option value="कागजात" {{if eq .Doc.Category "कागजात"}}selected{{end}}>{{t "कागजात (Document)"}}</option>
        <option value="रेकर्ड"  {{if eq .Doc.Category "रेकर्ड"}}selected{{end}}>{{t "रेकर्ड (Record)"}}</option>
        <option value="पत्रिका" {{if eq .Doc.Category "पत्रिका"}}selected{{end}}>{{t "पत्रिका (Journal)"}}</option>
        <option value="अंश"    {{if eq .Doc.Category "अंश"}}selected{{end}}>{{t "अंश (Excerpt)"}}</option>
        <option value="अन्य"   {{if eq .Doc.Category "अन्य"}}selected{{end}}>{{t "अन्य (Other)"}}</option>
      </select>
    </div>

    <!-- Language / Script -->
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label for="lang">{{t "भाषा / Language"}}</label>
        <select id="lang" name="lang">
          <option value="">{{t "— Select —"}}</option>
          <option value="en"    {{if eq .Doc.Lang "en"}}selected{{end}}>{{t "English"}}</option>
          <option value="ne"    {{if eq .Doc.Lang "ne"}}selected{{end}}>{{t "नेपाली"}}</option>
          <option value="sa"    {{if eq .Doc.Lang "sa"}}selected{{end}}>{{t "संस्कृत"}}</option>
          <option value="ne-sa" {{if eq .Doc.Lang "ne-sa"}}selected{{end}}>{{t "नेपाली + संस्कृत"}}</option>
          <option value="mixed" {{if eq .Doc.Lang "mixed"}}selected{{end}}>{{t "Mixed"}}</option>
          <option value="other" {{if eq .Doc.Lang "other"}}selected{{end}}>{{t "Other"}}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="script">{{t "लिपि / Script"}}</label>
        <select id="script" name="script">
          <option value="">{{t "— Select —"}}</option>
          <option value="devanagari" {{if eq .Doc.Script "devanagari"}}selected{{end}}>{{t "देवनागरी"}}</option>
          <option value="latin"      {{if eq .Doc.Script "latin"}}selected{{end}}>{{t "Latin / Roman"}}</option>
          <option value="iast"       {{if eq .Doc.Script "iast"}}selected{{end}}>{{t "Latin IAST"}}</option>
          <option value="mixed"      {{if eq .Doc.Script "mixed"}}selected{{end}}>{{t "Mixed"}}</option>
        </select>
      </div>
    </div>

    <!-- Original Date -->
    <div class="form-grid form-grid-date">
      <div class="form-group">
        <label for="orig_year">{{t "Original Year / मूल वर्ष"}}</label>
        <input type="text" id="orig_year" name="orig_year" value="{{.Doc.OrigYear}}" placeholder="{{t "e.g. 1815"}}">
      </div>
      <div class="form-group">
        <label for="orig_month">{{t "Month / महिना"}}</label>
        <select id="orig_month" name="orig_month">
          <option value="">—</option>
          <option value="01" {{if eq .Doc.OrigMonth "01"}}selected{{end}}>{{t "January"}}</option>
          <option value="02" {{if eq .Doc.OrigMonth "02"}}selected{{end}}>{{t "February"}}</option>
          <option value="03" {{if eq .Doc.OrigMonth "03"}}selected{{end}}>{{t "March"}}</option>
          <option value="04" {{if eq .Doc.OrigMonth "04"}}selected{{end}}>{{t "April"}}</option>
          <option value="05" {{if eq .Doc.OrigMonth "05"}}selected{{end}}>{{t "May"}}</option>
          <option value="06" {{if eq .Doc.OrigMonth "06"}}selected{{end}}>{{t "June"}}</option>
          <option value="07" {{if eq .Doc.OrigMonth "07"}}selected{{end}}>{{t "July"}}</option>
          <option value="08" {{if eq .Doc.OrigMonth "08"}}selected{{end}}>{{t "August"}}</option>
          <option value="09" {{if eq .Doc.OrigMonth "09"}}selected{{end}}>{{t "September"}}</option>
          <option value="10" {{if eq .Doc.OrigMonth "10"}}selected{{end}}>{{t "October"}}</option>
          <option value="11" {{if eq .Doc.OrigMonth "11"}}selected{{end}}>{{t "November"}}</option>
          <option value="12" {{if eq .Doc.OrigMonth "12"}}selected{{end}}>{{t "December"}}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="orig_day">{{t "Day / दिन"}}</label>
        <input type="number" id="orig_day" name="orig_day" value="{{.Doc.OrigDay}}" min="1" max="31">
      </div>
    </div>

    <!-- Authors -->
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label for="orig_author">{{t "Original Author (English)"}}</label>
        <input type="text" id="orig_author" name="orig_author" value="{{.Doc.OrigAuthor}}">
      </div>
      <div class="form-group">
        <label for="orig_author_np">{{t "Original Author (नेपाली)"}}</label>
        <input type="text" id="orig_author_np" name="orig_author_np" value="{{.Doc.OrigAuthorNP}}">
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">{{t "विवरण / Description"}}</label>
      <textarea id="description" name="description">{{.Doc.Description}}</textarea>
    </div>

    <!-- Body HTML (raw edit for admins) -->
    <div class="form-group">
      <label for="body_html">{{t "Content Body (HTML)"}}</label>
      <textarea id="body_html" class="code-textarea" name="body_html">{{.Doc.BodyHTML}}</textarea>
      <div class="form-hint">
        {{t "Raw HTML from the rich text editor. Edit with care."}}
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{t "परिवर्तन सुरक्षित गर्नुहोस्"}}</button>
      <a href="/document/{{.Doc.ID}}" class="btn btn-forest btn-link">{{t "रद्द गर्नुहोस्"}}</a>
    </div>
  </form>
</div>
{{end}}
